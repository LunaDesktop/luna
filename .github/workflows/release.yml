name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libfontconfig1-dev libfreetype6-dev

      # `luna-lock` wkompilowuje tapetę blokady przez
      # `include_bytes!("../../../assets/branding/paganlinux.png")`, czyli
      # z katalogu obok repozytorium (`$GITHUB_WORKSPACE/../assets`).
      # W monorepo ten katalog istnieje, w pojedynczym repo trzeba go dołożyć.
      - name: Branding (tapeta)
        run: |
          git clone --depth 1 https://github.com/LunaDesktop/branding.git "$RUNNER_TEMP/branding"
          mkdir -p "$GITHUB_WORKSPACE/../assets/branding"
          cp "$RUNNER_TEMP/branding/wallpapers/paganlinux.png" "$GITHUB_WORKSPACE/../assets/branding/"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Pakiet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          for bin in luna-panel luna-desktop luna-shell luna-apps luna-polkit luna-lock luna-keyring luna-eq luna-accounts luna-security; do
            cp "target/release/$bin" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS)
          tar -czf "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  distro:
    needs: build
    uses: LunaDesktop/luna/.github/workflows/distro-packages.yml@main
    with:
      package: "luna"
      description: "Luna — powłoka środowiska graficznego (panel, launcher, pulpit, blokada)"
      binaries: "luna-shell luna-desktop luna-panel luna-apps luna-polkit luna-lock luna-keyring luna-eq luna-accounts luna-security"
      files: |
        packaging/luna-portals.conf:/usr/share/xdg-desktop-portal/luna-portals.conf:644
      branding: true
      deb_depends: "libc6,libxkbcommon0,libxcursor1,libwayland-client0,libx11-6,libdbus-1-3,libluna,selene"
      rpm_depends: "glibc,libxkbcommon,libXcursor,libwayland-client,libX11,dbus-libs,libluna,selene"
      arch_depends: "glibc,libxkbcommon,libxcursor,wayland,libx11,dbus,libluna,selene"
